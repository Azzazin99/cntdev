<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข่าวประชาสัมพันธ์ - กลุ่มพัฒนาครูฯ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .news-link-item {
            display: block;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #eee;
            transition: color 0.2s;
            text-decoration: none;
            color: var(--text-dark);
        }

        .news-link-item:hover {
            color: var(--primary-purple);
        }

        .news-link-date {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 0.3rem;
            font-weight: 500;
        }

        .news-link-title {
            font-size: 1.1rem;
            font-weight: 400;
        }
    </style>
</head>

<body>

    <!-- Header Component -->
    <div id="header-placeholder"></div>

    <div class="container">
        <h1 class="section-title">📰 ข่าวประชาสัมพันธ์ทั้งหมด</h1>
        <div id="all-news-container" style="max-width: 900px;">
            <div style="padding: 2rem; color: #999; text-align: center;">⏳ กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- Logos -->
    <!-- External Links -->
    <!-- Footer Component -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/data.js?v=3"></script>
    <script src="assets/js/main.js?v=3"></script>

    <script>
        // Use an IIFE to ensure variables don't leak or conflict
        (function () {
            document.addEventListener('DOMContentLoaded', async () => {
                const container = document.getElementById('all-news-container');

                // 1. Try fetching data directly (Most reliable independence)
                try {
                    // Add timestamp to prevent caching
                    const response = await fetch(`assets/data/news.json?v=${new Date().getTime()}`);
                    if (response.ok) {
                        const data = await response.json();
                        renderNews(data);
                        return; // Exit if successful
                    }
                } catch (e) {
                    console.warn("Direct fetch failed, falling back to SITE_DATA logic");
                }

                // 2. Fallback: Wait for main.js SITE_DATA
                const checkData = setInterval(() => {
                    if (window.SITE_DATA && window.SITE_DATA.news && window.SITE_DATA.news.length > 0) {
                        clearInterval(checkData);
                        renderNews(window.SITE_DATA.news);
                    }
                }, 100);

                // 3. Safety timeout
                setTimeout(() => {
                    clearInterval(checkData);
                    if (container.innerHTML.includes('กำลังโหลด')) {
                        console.error("Data loading timed out.");
                        // Try rendering what we have, or show error
                        if (window.SITE_DATA && window.SITE_DATA.news) {
                            renderNews(window.SITE_DATA.news);
                        } else {
                            container.innerHTML = '<div style="text-align:center; padding:2rem; color:#d32f2f;">ไม่สามารถโหลดข้อมูลได้ กรุณารีเฟรชหน้าจอ</div>';
                        }
                    }
                }, 5000);
            });

            function renderNews(dataSource) {
                const container = document.getElementById('all-news-container');
                const allNews = dataSource || window.SITE_DATA?.news || [];

                // Filter strictly for 'news'
                const filtered = allNews.filter(item => item.category === 'news');

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 3rem; color: #999;">
                            ไม่มีข่าวประชาสัมพันธ์
                        </div>
                    `;
                } else {
                    container.innerHTML = filtered.slice().map(news => `
                        <a href="#" onclick="openPopup('${news.link}'); return false;" class="news-link-item">
                            <div class="news-link-date">📅 ${news.date}</div>
                            <div class="news-link-title">${news.title}</div>
                        </a>
                    `).join('');
                }
            }
        })();
    </script>
</body>

</html>
